<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>网站</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: #000;
      font: 14px sans-serif;
    }
    #app { width: 320px; margin: 80px auto 0; }
    textarea {
      display: block;
      box-sizing: border-box;
      width: 100%;
      height: 90px;
      padding: 6px;
      border: 1px solid #777;
      border-radius: 0;
      background: #fff;
      color: #000;
      font: inherit;
      resize: none;
    }
    button {
      display: block;
      margin-top: 6px;
      padding: 3px 12px;
      border: 1px solid #777;
      border-radius: 0;
      background: #eee;
      color: #000;
      font: inherit;
      cursor: pointer;
    }
    button:disabled {
      color: #000;
      background: #eee;
      opacity: 1;
      cursor: default;
    }
  </style>
</head>
<body>
  <main id="app" data-lb-reason-gate="inline-v1">
    <textarea id="reason" maxlength="500" autofocus required
      aria-label="访问理由"></textarea>
    <button id="submit" type="button" disabled>确定</button>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
